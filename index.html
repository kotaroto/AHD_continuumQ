<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1326">
<title>Rounds Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a projector "stage" for the host (one screen, type scaled to the room) and a one-thumb column for phones.
   Single deliberate dark look: it reads well on projectors and keeps phones from glaring in a dim room. */
:root{
  --night:#0d1326;      /* page ground */
  --deck:#151d36;       /* panels */
  --raised:#1f2947;     /* inputs, rows */
  --line:#2f3b62;       /* hairlines */
  --chalk:#eef1fb;      /* main text */
  --dim:#9aa3c4;        /* secondary text */
  --gold:#ffc23d;       /* accent: scores, primary actions */
  --gold-ink:#241a00;
  --good:#2fd481;
  --bad:#ff6170;
  --a:#e94a57; --b:#3a7ff0; --c:#f0b400; --d:#14a466;   /* answer colours, always paired with a shape */
  --a-ink:#fff; --b-ink:#fff; --c-ink:#1d1500; --d-ink:#fff;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--chalk);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:.6em 1em;font-weight:700;min-height:42px;transition:transform .08s,background .15s}
.btn:hover{background:#28335a}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.btn.primary:hover{background:#ffcd5e}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:transparent}
.btn.small{min-height:34px;padding:.35em .7em;font-size:.88rem}
.btn.big{font-size:1.15rem;min-height:54px;padding:.7em 1.4em;border-radius:12px}
.linkbtn{background:none;border:0;color:var(--dim);text-decoration:underline;text-underline-offset:3px;padding:0}

/* fields */
label.f{display:grid;gap:6px;font-weight:700;font-size:.9rem}
.f small{font-weight:400;color:var(--dim)}
input[type=text],input[type=url],textarea,select{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:.65em .8em;min-height:44px}
textarea{resize:vertical;min-height:90px;line-height:1.4}
input::placeholder,textarea::placeholder{color:#6f7aa0}
.check{display:flex;align-items:center;gap:.55em;font-weight:700;font-size:.92rem}
.check input{width:20px;height:20px;accent-color:var(--gold)}
.err{color:var(--bad);font-weight:700;font-size:.92rem;margin:0}
.note{color:var(--dim);font-size:.9rem;margin:0}

/* shapes */
.shape{width:1.15em;height:1.15em;flex:none;fill:currentColor}

/* ======================== Landing / player ======================== */
.phone{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-block:16px 24px}
.brand{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;display:flex;align-items:baseline;gap:.35em}
.brand .dot{width:.42em;height:.42em;border-radius:50%;background:var(--gold);display:inline-block;transform:translateY(-.05em);box-shadow:0 0 0 .14em color-mix(in srgb,var(--gold) 30%,transparent)}
.landing-hero{padding:18px 0 14px}
.landing-hero .brand{font-size:clamp(2.4rem,11vw,3.6rem)}
.landing-hero p{color:var(--dim);margin:.4rem 0 0;max-width:34ch}
.card{background:var(--deck);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:16px}
.code-input{font-family:var(--f-mono);font-size:2rem;letter-spacing:.4em;text-transform:uppercase;text-align:center;padding:.3em .2em .3em .6em!important;font-weight:600}
.avatars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.avatars button{aspect-ratio:1;max-width:100%;font-size:1.45rem;border-radius:10px;border:2px solid transparent;background:var(--raised);display:grid;place-items:center;padding:0}
.avatars button[aria-pressed=true]{border-color:var(--gold);background:#2b3762}
.landing-foot{margin-top:auto;padding-top:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}

.p-top{display:flex;align-items:center;gap:10px;padding:4px 0 14px}
.p-me{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.p-ava{font-size:1.7rem;width:46px;height:46px;border-radius:12px;background:var(--raised);display:grid;place-items:center;flex:none}
.p-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-score{font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--gold)}
.conn{width:10px;height:10px;border-radius:50%;background:var(--good);flex:none}
.conn.off{background:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.p-center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;padding:12px 0}
.p-big{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,9vw,2.8rem);line-height:1.05}
.p-sub{color:var(--dim);margin:0}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--gold);animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.p-q{display:flex;flex-direction:column;gap:12px;flex:1}
.p-qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.p-timer{height:8px;border-radius:99px;background:var(--raised);overflow:hidden}
.p-timer i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .2s linear}
.p-qtext{font-family:var(--f-display);font-weight:700;font-size:1.2rem;line-height:1.25}
.p-opts{display:grid;gap:10px;margin-top:auto}
.p-opts.grid2{grid-template-columns:1fr 1fr}
.p-opt{display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:var(--r);padding:14px;min-height:76px;font-weight:700;font-size:1.05rem;line-height:1.2;box-shadow:inset 0 -4px 0 rgb(0 0 0 / .22)}
.p-opts.grid2 .p-opt{flex-direction:column;align-items:flex-start;min-height:110px}
.p-opt .shape{width:1.4em;height:1.4em}
.p-opt.sel{outline:4px solid var(--chalk);outline-offset:3px}
.p-opt.faded{opacity:.28}
.p-opt[disabled]{cursor:default}
.locked{text-align:center;color:var(--dim);font-weight:700;margin:4px 0 0}
.result{border-radius:20px;padding:26px 18px;display:grid;gap:8px;text-align:center}
.result.ok{background:color-mix(in srgb,var(--good) 18%,var(--deck));border:2px solid var(--good)}
.result.no{background:color-mix(in srgb,var(--bad) 14%,var(--deck));border:2px solid var(--bad)}
.result .p-big{font-size:2.3rem}
.result .pts{font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:var(--gold)}
.answer-was{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:700;padding:10px;border-radius:12px;background:var(--raised);text-align:left}
.rankline{font-size:1.15rem}
.rankline b{font-family:var(--f-display);font-size:1.5rem;color:var(--chalk)}

/* ======================== Host: bank ======================== */
.topbar{display:flex;align-items:center;gap:14px;padding-block:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar .brand{font-size:1.5rem}
.badge{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.3em .6em;border-radius:99px;background:var(--raised);color:var(--dim);border:1px solid var(--line)}
.badge.warn{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.spacer{flex:1}
.bank{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;padding-block:20px 60px;max-width:1240px;margin:0 auto}
@media (max-width:820px){.bank{grid-template-columns:minmax(0,1fr)}}
.sets{display:grid;gap:6px;align-content:start}
.sets h2{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-family:var(--f-body);margin:0 0 4px}
.set-item{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:10px 12px;width:100%}
.set-item:hover{background:var(--deck)}
.set-item[aria-current=true]{background:var(--deck);border-color:var(--line)}
.set-item span:first-child{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.set-item .cnt{color:var(--dim);font-size:.85rem;flex:none}
.set-main{display:grid;gap:18px;min-width:0;align-content:start}
.set-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end}
@media (max-width:820px){.set-head{grid-template-columns:minmax(0,1fr)}}
.set-name{font-family:var(--f-display);font-size:1.8rem!important;font-weight:800;background:transparent!important;border-color:transparent!important;padding-left:0!important}
.set-name:hover,.set-name:focus{border-color:var(--line)!important;padding-left:.4em!important}
.play{background:var(--deck);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.play .opts{display:grid;gap:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--gold) 12%,var(--deck));border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:14px;padding:12px 16px}
.banner p{margin:0;flex:1;min-width:200px}
.qlist{display:grid;gap:10px;counter-reset:q}
.qcard{background:var(--deck);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start}
.qnum{font-family:var(--f-mono);color:var(--dim);font-weight:600;padding-top:2px}
.qbody{display:grid;gap:8px;min-width:0}
.qtext{font-weight:700;overflow-wrap:anywhere}
.qopts{display:flex;flex-wrap:wrap;gap:6px}
.qopt{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;padding:.25em .6em;border-radius:8px;background:var(--raised);color:var(--dim);max-width:100%;overflow-wrap:anywhere}
.qopt.right{color:var(--chalk);background:color-mix(in srgb,var(--good) 22%,var(--raised));outline:1px solid color-mix(in srgb,var(--good) 60%,transparent)}
.qopt .shape{width:.95em;height:.95em}
.qmeta{display:flex;gap:10px;flex-wrap:wrap;color:var(--dim);font-size:.82rem}
.qacts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.qcard{grid-template-columns:auto minmax(0,1fr)}.qacts{grid-column:1/-1;justify-content:flex-start}}
.iconbtn{background:transparent;border:1px solid transparent;border-radius:8px;min-width:34px;min-height:34px;color:var(--dim);font-weight:700;font-size:.85rem;padding:0 .5em}
.iconbtn:hover{background:var(--raised);color:var(--chalk)}
.editor{background:var(--deck);border:1px solid var(--gold);border-radius:16px;padding:16px;display:grid;gap:14px}
.optrows{display:grid;gap:8px}
.optrow{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:center}
.optrow .tag{width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.optrow input[type=radio]{width:22px;height:22px;accent-color:var(--good)}
.row2{display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px}
@media (max-width:640px){.row2{grid-template-columns:minmax(0,1fr)}}
.empty{border:1px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--dim)}
pre.fmt{background:var(--night);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;font-family:var(--f-mono);font-size:.82rem;overflow-x:auto;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:var(--night);padding:.6em 1em;border-radius:10px;font-weight:700;z-index:50;box-shadow:0 8px 30px rgb(0 0 0 / .4);max-width:calc(100% - 32px)}

/* ======================== Host: stage ======================== */
.stage{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.stage-bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.stage-bar .brand{font-size:1.25rem}
.joinpill{font-size:clamp(.9rem,1.3vw,1.15rem);color:var(--dim)}
.joinpill b{color:var(--chalk)}
.joinpill .mono{color:var(--gold);font-size:1.15em;letter-spacing:.12em}
.net{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--dim)}
.net i{width:9px;height:9px;border-radius:50%;background:var(--good)}
.net.bad i{background:var(--bad);animation:blink 1s infinite}
.net.wait i{background:var(--gold);animation:blink 1s infinite}
.stage-body{overflow:auto;padding-block:clamp(14px,2.4vh,28px);display:flex;flex-direction:column;min-height:0}
.stage-foot{display:flex;align-items:center;gap:12px;padding-block:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.kbd{font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:.05em .45em;color:var(--dim)}
.hint{color:var(--dim);font-size:.9rem}

/* lobby */
.lobby{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(18px,3vw,48px);flex:1;align-items:start}
@media (max-width:860px){.lobby{grid-template-columns:minmax(0,1fr)}}
.joinbox{background:var(--deck);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,2.4vw,30px);display:grid;gap:14px;justify-items:center;text-align:center}
.qr{background:#fff;border-radius:16px;padding:10px;width:min(100%,clamp(180px,24vw,320px));aspect-ratio:1;max-width:100%}
.qr svg{width:100%;height:100%;display:block}
.code-big{font-family:var(--f-mono);font-weight:600;font-size:clamp(3rem,8vw,7rem);letter-spacing:.14em;line-height:1;color:var(--gold);padding-left:.14em}
.joinurl{font-size:clamp(1rem,1.5vw,1.3rem);overflow-wrap:anywhere}
.joinurl b{font-family:var(--f-mono);font-weight:600}
.lobby-side{display:grid;gap:16px;align-content:start}
.lobby-side h1{font-size:clamp(1.8rem,3.4vw,3.2rem);font-weight:800}
.pcount{font-family:var(--f-display);font-weight:800;font-size:clamp(1.4rem,2.4vw,2.2rem)}
.pcount span{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.chip{display:inline-flex;align-items:center;gap:.45em;background:var(--raised);border:1px solid var(--line);border-radius:99px;padding:.3em .8em .3em .35em;font-weight:700;font-size:clamp(.95rem,1.35vw,1.2rem);max-width:100%}
.chip .ava{font-size:1.25em;line-height:1}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip.off{opacity:.45}
.chip.new{animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.4);opacity:0}}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--bad)}
.chip.kick{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--raised))}
.waiting{color:var(--dim);font-size:1.1rem;padding:24px;border:1px dashed var(--line);border-radius:16px;text-align:center}

/* question */
.qstage{display:flex;flex-direction:column;gap:clamp(12px,2vh,24px);flex:1;min-height:0}
.qhead{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.qhead .eyebrow{font-size:clamp(.85rem,1.2vw,1.05rem)}
.ring{position:relative;width:clamp(64px,7vw,96px);aspect-ratio:1;flex:none;margin-left:auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .track{stroke:var(--raised)}
.ring .bar{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.ring.low .bar{stroke:var(--bad)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:clamp(1.4rem,2.6vw,2.4rem)}
.anscount{text-align:center;line-height:1}
.anscount b{display:block;font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,3vw,2.8rem)}
.anscount span{font-size:.8rem;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.qbig{font-size:clamp(1.6rem,3.3vw,3.4rem);font-weight:700;letter-spacing:-.01em;max-width:44ch}
.qimg{max-height:30vh;width:auto;max-width:100%;border-radius:12px;align-self:flex-start;background:#000}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.2vw,16px);margin-top:auto}
@media (max-width:700px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{position:relative;display:flex;align-items:center;gap:.8em;border-radius:16px;padding:clamp(12px,1.6vw,22px) clamp(14px,1.8vw,24px);font-weight:700;font-size:clamp(1.05rem,2vw,1.9rem);line-height:1.2;min-height:clamp(64px,10vh,120px);box-shadow:inset 0 -5px 0 rgb(0 0 0 / .22);overflow:hidden;min-width:0}
.tile .shape{width:1.3em;height:1.3em}
.tile .txt{min-width:0;overflow-wrap:anywhere;flex:1}
.tile .cnt{font-family:var(--f-display);font-weight:800;font-size:1.1em;margin-left:auto;padding-left:.4em}
.tile .bar{position:absolute;left:0;bottom:0;height:6px;background:rgb(255 255 255 / .75);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.tile.dim{opacity:.3;filter:saturate(.6)}
.tile.win{outline:5px solid var(--chalk);outline-offset:4px}
.tile .tick{width:1.4em;height:1.4em;border-radius:50%;background:var(--chalk);color:var(--night);display:grid;place-items:center;font-size:.8em;flex:none}
.c0{background:var(--a);color:var(--a-ink)} .c1{background:var(--b);color:var(--b-ink)} .c2{background:var(--c);color:var(--c-ink)} .c3{background:var(--d);color:var(--d-ink)}
.c2 .bar{background:rgb(0 0 0 / .45)}
.who{display:flex;flex-wrap:wrap;gap:6px}
.who .chip{font-size:.95rem;padding:.2em .7em .2em .3em}
.who .chip.todo{opacity:.35;border-style:dashed}
.who .chip.done{border-color:var(--gold)}

/* reveal */
.reveal-low{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(14px,2vw,28px);align-items:start}
.reveal-low.one{grid-template-columns:minmax(0,1fr)}
@media (max-width:860px){.reveal-low{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--deck);border:1px solid var(--line);border-radius:16px;padding:clamp(12px,1.6vw,20px);display:grid;gap:10px}
.panel h3{font-size:clamp(1rem,1.5vw,1.35rem)}
.rightlist{display:flex;flex-wrap:wrap;gap:8px}
.rightlist .chip{font-size:clamp(.9rem,1.25vw,1.1rem)}
.rightlist .chip em{font-style:normal;color:var(--gold);font-family:var(--f-display);font-weight:800}
.rightlist .chip.first{border-color:var(--gold)}
.expl{font-size:clamp(1rem,1.5vw,1.3rem);line-height:1.45;margin:0;max-width:65ch}
.qbig.sm{font-size:clamp(1.25rem,2.4vw,2.3rem)}

/* leaderboard */

'use strict';
/* ============================================================
   Rounds Live — live multiple-choice quiz
   Host (big screen): ?host        Player (phone): ?join=CODE  (or the landing page)
   Add &net=local to test on one computer with several tabs (no internet needed).
   ============================================================ */

const QS = new URLSearchParams(location.search);
const NET_LOCAL = QS.get('net') === 'local';
const PEER_PREFIX = 'roundslive-v2-';
const BANK_KEY = 'roundslive.bank.v1';
const GAME_KEY = 'roundslive.game.v1';
const PROFILE_KEY = 'roundslive.profile';
const ME_KEY = c => 'roundslive.me.' + c;
const LETTERS = 'ABCD';
const AVATARS = ['🦊','🐙','🦉','🐢','🦄','🐝','🐧','🦁','🐸','🐳','🦔','🐨','🦩','🐼','🦖','🐌'];
const BOT_NAMES = ['Babinski','Romberg','Hoffmann','Kernig','Brudzinski','Chaddock','Tinel','Phalen','Lhermitte','Hoover','Battle','Horner'];
const CODE_ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (n = 12) => { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(x => 'abcdefghijkmnpqrstuvwxyz23456789'[x % 32]).join(''); };
const randCode = () => { const a = new Uint8Array(4); crypto.getRandomValues(a); return [...a].map(x => CODE_ALPHA[x % CODE_ALPHA.length]).join(''); };
const normCode = c => String(c || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
const cleanName = n => String(n || '').replace(/[\u0000-\u001f\u007f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 16);
const fmt = n => Number(n || 0).toLocaleString('en-US');
const clone = o => JSON.parse(JSON.stringify(o));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const app = $('#app');

const SHAPES = [
  '<svg class="shape" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 22 20H2z"/></svg>',
  '<svg class="shape" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 22 12 12 22 2 12z"/></svg>',

];

}

let wakeLock = null;
async function keepAwake() {

}

/* ---------------- sound (host) ---------------- */
const SFX = {
  ctx: null, on: LS.get('roundslive.sound', true),
  ensure() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  tone(f, dur, type = 'sine', vol = .07, when = 0) {
    if (!this.on) return; const c = this.ensure(); if (!c) return;
    const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
  },
  tick() { this.tone(1046, .06, 'square', .025); },
  pop() { this.tone(660, .07, 'triangle', .045); },
  start() { [523, 659, 784].forEach((f, i) => this.tone(f, .16, 'triangle', .06, i * .09)); },
  reveal() { [392, 523, 659].forEach((f, i) => this.tone(f, .22, 'triangle', .06, i * .07)); },
  drum() { for (let i = 0; i < 18; i++) this.tone(110 + (i % 2) * 8, .07, 'triangle', .05 + i * .004, i * .085); },
  fanfare() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, i >= 5 ? .8 : .17, 'sawtooth', .045, i * .15)); }
};

/* ---------------- confetti ---------------- */
function confetti(n = 220) {
  if (REDUCED) return;
  const cv = $('#fx'); cv.hidden = false;
  const ctx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  const W = innerWidth, H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#e94a57', '#3a7ff0', '#f0b400', '#14a466', '#ffc23d', '#eef1fb'];
  const parts = Array.from({ length: n }, () => ({
    x: W / 2 + (Math.random() - .5) * W * .3, y: H * .55, vx: (Math.random() - .5) * 16, vy: -(8 + Math.random() * 14),
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .4, w: 6 + Math.random() * 8, h: 8 + Math.random() * 10, c: cols[(Math.random() * cols.length) | 0]
  }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of parts) {
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if (p.y < H + 40) alive++;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, Math.abs(Math.cos(p.r * 2)) * p.h + 1); ctx.restore();
    }
    if (alive && t - t0 < 7000) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
  })(t0);
}

/* ============================================================
   Transport. Every device connects OUT to a public message relay (MQTT over secure WebSocket),
   so there is no direct phone-to-laptop link for carriers or hospital firewalls to block.
   The host listens on two relays at once; phones try the first and fall back to the second.
   &net=local uses BroadcastChannel (several tabs on one computer, no internet needed).
   &broker=wss://… overrides the relay (for testing).
   Host:   hostTransport(code, {onReady, onMessage(cid,msg), onDisconnect(cid), onIdTaken, onNetIssue})
   Player: clientTransport(code, {onOpen, onMessage(msg), onClose, onError})
   ============================================================ */
const BROKERS = QS.get('broker') ? [QS.get('broker')] : ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const topicBase = code => 'roundslive/v2/' + String(code).toUpperCase();
const mqttReady = () => typeof mqtt !== 'undefined' && typeof mqtt.connect === 'function';
const MQTT_OPTS = { clean: true, keepalive: 20, reconnectPeriod: 2000, connectTimeout: 10000, protocolVersion: 4 };

function hostTransport(code, h) { return NET_LOCAL ? localHost(code, h) : relayHost(code, h); }
function clientTransport(code, h) { return NET_LOCAL ? localClient(code, h) : relayClient(code, h); }

function relayHost(code, h) {
  const base = topicBase(code), clients = [], route = new Map();
  let dead = false, lastUp = null;
  const status = () => {
    if (dead) return;
    const up = clients.some(c => c && c.connected && c._rlSubscribed);
    if (up === lastUp) return; lastUp = up;
    if (up) h.onReady(); else h.onNetIssue({ type: 'network' });
  };
  return {
    start() {
      if (!mqttReady()) { h.onNetIssue({ type: 'lib-missing' }); return; }
      BROKERS.forEach((url, i) => {
        const c = mqtt.connect(url, { ...MQTT_OPTS, clientId: 'rlh_' + uid(12) });
        clients[i] = c;
        c.on('connect', () => {
          c._rlSubscribed = false;
          c.subscribe(base + '/up/+', { qos: 1 }, err => { if (!err) { c._rlSubscribed = true; } status(); });
        });
        c.on('message', (topic, payload) => {
          if (dead) return;
          const cid = topic.slice(base.length + 4);
          if (!/^[a-z0-9]{6,40}$/.test(cid)) return;
          let m; try { m = JSON.parse(payload.toString()); } catch { return; }
          route.set(cid, i);
          h.onMessage(cid, m);
        });
        c.on('close', () => { c._rlSubscribed = false; status(); });
        c.on('offline', () => { c._rlSubscribed = false; status(); });
        c.on('error', () => {});
      });
      setTimeout(() => { if (lastUp === null) { lastUp = false; h.onNetIssue({ type: 'network' }); } }, 12000);
    },
    send(cid, msg) {
      const c = clients[route.get(cid)];
      if (c && c.connected) { try { c.publish(base + '/down/' + cid, JSON.stringify(msg), { qos: 1 }); } catch {} }
    },
    drop(cid) { route.delete(cid); },
    destroy() { dead = true; clients.forEach(c => { try { c.end(true); } catch {} }); }
  };
}

let relayAttempt = 0;
function relayClient(code, h) {
  const base = topicBase(code), cid = 'c' + uid(14);
  let closed = false, heard = false, opened = false, notFoundT = null;
  if (!mqttReady()) { setTimeout(() => h.onError({ type: 'lib-missing' })); return { send() {}, destroy() {} }; }
  const url = BROKERS[relayAttempt++ % BROKERS.length];
  const c = mqtt.connect(url, { ...MQTT_OPTS, clientId: 'rlp_' + uid(12) });
  c.on('connect', () => {
    c.subscribe(base + '/down/' + cid, { qos: 1 }, err => {
      if (err || closed) return;
      h.onOpen();   // (re)announce ourselves to the host on every (re)connect
      if (!opened) {
        opened = true;
        // the host answers within a second when the game exists; silence means no lobby with this code
        notFoundT = setTimeout(() => { if (!heard && !closed) h.onError({ type: 'peer-unavailable' }); }, 7000);
      }
    });
  });
  c.on('message', (topic, payload) => {
    if (closed) return;
    let m; try { m = JSON.parse(payload.toString()); } catch { return; }
    heard = true; h.onMessage(m);
  });
  c.on('error', () => {});
  return {
    send(m) { if (c.connected) { try { c.publish(base + '/up/' + cid, JSON.stringify(m), { qos: 1 }); } catch {} } },
    destroy() { closed = true; clearTimeout(notFoundT); try { c.end(true); } catch {} }
  };
}

function localHost(code, h) {
  let bc = null;
  return {
    start() {
      bc = new BroadcastChannel(PEER_PREFIX + code);
      bc.onmessage = e => {
        const { from, to, kind, msg } = e.data || {};
        if (to !== 'host') return;
        if (kind === 'hello') { bc.postMessage({ from: 'host', to: from, kind: 'welcome' }); return; }
        if (kind === 'bye') { h.onDisconnect(from); return; }
        h.onMessage(from, msg);
      };
      setTimeout(() => h.onReady(), 30);
    },
    send(id, msg) { bc && bc.postMessage({ from: 'host', to: id, msg }); },
    drop(id) {},
    destroy() { try { bc && bc.close(); } catch {} }
  };
}

function localClient(code, h) {
  const me = 'c' + uid(8);
  const bc = new BroadcastChannel(PEER_PREFIX + code);
  let open = false, closed = false;
  bc.onmessage = e => {
    const { to, kind, msg } = e.data || {};
    if (to !== me || closed) return;
    if (kind === 'welcome') { if (!open) { open = true; h.onOpen(); } return; }
    h.onMessage(msg);
  };
  bc.postMessage({ from: me, to: 'host', kind: 'hello' });
  setTimeout(() => { if (!open && !closed) h.onError({ type: 'peer-unavailable' }); }, 2500);
  const bye = () => { try { bc.postMessage({ from: me, to: 'host', kind: 'bye' }); } catch {} };
  addEventListener('pagehide', bye);
  return {
    send(m) { if (!closed) bc.postMessage({ from: me, to: 'host', msg: m }); },
    destroy() { if (closed) return; bye(); closed = true; removeEventListener('pagehide', bye); try { bc.close(); } catch {} }
  };
}

/* ============================================================
   Question bank

function normQuestion(q) {
  const options = (Array.isArray(q.options) ? q.options : []).map(o => String(o ?? '').trim()).filter(Boolean).slice(0, 4);
  let correct = Number.isInteger(+q.correct) ? +q.correct : 0;
  if (correct < 0 || correct >= options.length) correct = 0;
  let time = Math.round(+q.time || 20); time = Math.max(5, Math.min(300, time));
  return { id: String(q.id || uid(8)), text: String(q.text || '').trim(), options, correct, time,
    explanation: String(q.explanation || '').trim(), image: String(q.image || '').trim() };
}
function normSet(s) {
  return { id: String(s.id || uid(8)), name: String(s.name || 'Untitled set').trim() || 'Untitled set',
    questions: (Array.isArray(s.questions) ? s.questions : []).map(normQuestion).filter(q => q.text && q.options.length >= 2) };
}
function validQuestion(q) {
  if (!q.text) return 'Write the question.';
  if (q.options.length < 2) return 'Give at least two answer choices.';
  return '';
}

const Bank = {
  sets: [], dismissed: [],
  load() {
    let seed = { sets: [] };
    try { seed = JSON.parse($('#seed-bank').textContent); } catch {}
    const b = LS.get(BANK_KEY, null);
    this.sets = (b && Array.isArray(b.sets) ? b.sets : []).map(normSet);
    this.dismissed = (b && Array.isArray(b.dismissedSeeds)) ? b.dismissedSeeds : [];
    for (const s of (seed.sets || [])) {
      if (!this.sets.some(x => x.id === s.id) && !this.dismissed.includes(s.id)) this.sets.push(normSet(s));
    }
    this.save();
  },
  save() { this.ok = LS.set(BANK_KEY, { v: 1, sets: this.sets, dismissedSeeds: this.dismissed }); },
  get(id) { return this.sets.find(s => s.id === id); }
};

/* paste format:
   Which artery…?
   A. option
   B. option *
   C. option
   Explanation: …   Time: 30   Image: https://…
   (blank line between questions; mark the right answer with * at the start or end) */
function parseBulk(text) {
  const blocks = String(text).replace(/\r/g, '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  const out = [], errors = [], failed = [];
  blocks.forEach((b, bi) => {
    const before = errors.length;
    const lines = b.split('\n').map(l => l.trim()).filter(Boolean);
    const q = { text: '', options: [], correct: -1, time: 20, explanation: '', image: '' };
    for (const line of lines) {
      let m;
      if ((m = line.match(/^(explanation|why|answer note)\s*:\s*(.*)$/i))) { q.explanation = m[2]; continue; }
      if ((m = line.match(/^time\s*:\s*(\d+)/i))) { q.time = +m[1]; continue; }
      if ((m = line.match(/^image\s*:\s*(\S+)/i))) { q.image = m[1]; continue; }
      if ((m = line.match(/^(\*)?\s*([A-Da-d])\s*[.)\]:-]\s*(.+?)\s*(\*)?$/)) && (q.text || q.options.length)) {
        if (m[1] || m[4]) q.correct = q.options.length;
        q.options.push(m[3].replace(/\s*\((correct|answer)\)\s*$/i, () => { q.correct = q.options.length; return ''; }));
        continue;
      }
      if (!q.options.length) q.text = (q.text ? q.text + ' ' : '') + line.replace(/^(q(uestion)?\s*\d*\s*[:.)]|\d+\s*[.)])\s*/i, '');
      else q.explanation = (q.explanation ? q.explanation + ' ' : '') + line;
    }
    if (!q.text) errors.push(`Question ${bi + 1}: no question text.`);
    else if (q.options.length < 2) errors.push(`Question ${bi + 1}: needs at least two lines starting with A., B., …`);
    else if (q.options.length > 4) errors.push(`Question ${bi + 1}: has more than four choices (A–D only).`);
    else if (q.correct < 0) errors.push(`Question ${bi + 1}: mark the right answer with * (for example "B. Lacosamide *").`);
    else out.push(normQuestion(q));
    if (errors.length > before) failed.push(b);
  });
  return { questions: out, errors, failed };
}

const Host = {
  active: false,

  tickT: null, hbT: null, botT: [], lastTickSec: null, lobbyT: null, finalT: [], kickConfirm: null, endConfirm: false,

            <button class="btn primary small" data-act="resume">Resume game</button><button class="btn small ghost" data-act="discard">Discard</button></div>` : ''}

        ${this.confirm === 'set' ? `<span class="note">Delete "${esc(set.name)}" and its ${set.questions.length} questions?</span><button class="btn small danger" data-act="delset">Delete set</button><button class="btn small ghost" data-act="cancelconfirm">Keep</button>`
          : `<button class="btn small danger" data-act="askdelset">Delete set</button>`}
      </div>
      ${this.bulk ? this.bulkHtml() : ''}
      ${editing === 'new' ? this.editorHtml(null) : ''}
      <div class="qlist">${qcards || (editing === 'new' || this.bulk ? '' : '<div class="empty">No questions in this set yet. Add one, or paste several at once.</div>')}</div>`;
  },

  editorHtml(q) {
    const v = q || { text: '', options: ['', '', '', ''], correct: 0, time: 20, explanation: '', image: '' };
    const opts = [0, 1, 2, 3].map(i => v.options[i] || '');
    return `
      <form class="editor" id="qform" data-id="${q ? q.id : 'new'}">
        <label class="f" for="f-text">Question<textarea id="f-text" rows="2" maxlength="400" placeholder="Which antiseizure medication…">${esc(v.text)}</textarea></label>
        <div class="f" style="display:grid;gap:8px"><span style="font-weight:700;font-size:.9rem">Answer choices <small>· select the correct one · C and D are optional</small></span>
          <div class="optrows">${opts.map((o, i) => `
            <div class="optrow">
              <input type="radio" name="f-correct" id="f-correct${i}" value="${i}" ${v.correct === i ? 'checked' : ''} aria-label="Choice ${LETTERS[i]} is correct">
              <span class="tag c${i}">${SHAPES[i]}</span>
              <input type="text" id="f-opt${i}" value="${esc(o)}" maxlength="140" placeholder="Choice ${LETTERS[i]}${i > 1 ? ' (optional)' : ''}">
