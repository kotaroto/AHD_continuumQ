        <div class="row2">
          <label class="f" for="f-time">Time limit
            <select id="f-time">${[10, 15, 20, 25, 30, 45, 60, 90, 120].map(t => `<option value="${t}" ${v.time === t ? 'selected' : ''}>${t} seconds</option>`).join('')}${[10, 15, 20, 25, 30, 45, 60, 90, 120].includes(v.time) ? '' : `<option value="${v.time}" selected>${v.time} seconds</option>`}</select></label>
          <label class="f" for="f-img">Image link <small>· optional, shown on the main screen only</small><input type="url" id="f-img" value="${esc(v.image)}" placeholder="https://…"></label>
        </div>
        <label class="f" for="f-expl">Explanation <small>· optional, shown after the answer is revealed</small><textarea id="f-expl" rows="2" maxlength="600">${esc(v.explanation)}</textarea></label>
        ${this.editErr ? `<p class="err">${esc(this.editErr)}</p>` : ''}
        <div class="toolbar"><button class="btn primary" type="submit">${q ? 'Save changes' : 'Add question'}</button><button class="btn ghost" type="button" data-act="canceledit">Cancel</button></div>
      </form>`;
  },

  bulkHtml() {
    const m = this.bulkMsg;
    return `
      <div class="editor">
        <label class="f" for="bulk-text">Paste questions <small>· blank line between questions · put * on the correct choice</small>
          <textarea id="bulk-text" rows="10" placeholder="Which artery supplies…?&#10;A. Anterior choroidal&#10;B. Recurrent artery of Heubner *&#10;C. Lenticulostriate&#10;D. Posterior communicating&#10;Explanation: optional&#10;Time: 30">${esc(this.bulkText)}</textarea></label>
        <pre class="fmt">1. Question text
A. Choice
B. Correct choice *
C. Choice
Explanation: optional      Time: 30      Image: https://… (optional)</pre>
        ${m && m.errors.length ? `<div>${m.errors.map(e => `<p class="err">${esc(e)}</p>`).join('')}</div>` : ''}
        <div class="toolbar"><button class="btn primary" data-act="bulkadd">Add to set</button><button class="btn ghost" data-act="bulkcancel">Cancel</button></div>
      </div>`;
  },

  saveEditor() {
    const f = $('#qform'); if (!f) return;
    const options = [0, 1, 2, 3].map(i => $('#f-opt' + i).value.trim());
    const checked = +(f.querySelector('input[name=f-correct]:checked') || { value: 0 }).value;
    // compact options, keep track of which one is correct
    const kept = []; let correct = -1;
    options.forEach((o, i) => { if (o) { if (i === checked) correct = kept.length; kept.push(o); } });
    const raw = { id: f.dataset.id === 'new' ? uid(8) : f.dataset.id, text: $('#f-text').value, options: kept, correct, time: +$('#f-time').value, explanation: $('#f-expl').value, image: $('#f-img').value };
    if (kept.length >= 2 && correct < 0) { this.editErr = 'The selected correct choice is empty. Pick a choice that has text.'; this.renderBank(); return; }
    const q = normQuestion(raw);
    const err = validQuestion(q);
    if (err) { this.editErr = err; this.renderBank(); return; }
    const set = Bank.get(this.sel);
    const i = set.questions.findIndex(x => x.id === q.id);
    if (i >= 0) set.questions[i] = q; else set.questions.push(q);
    Bank.save(); this.edit = null; this.editErr = '';
    toast(i >= 0 ? 'Question saved' : 'Question added');
    this.renderBank();
  },

  download(name, text, type = 'application/json') {
    const blob = new Blob([text], { type });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  },

  async importFile(file) {
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      let sets = Array.isArray(data) ? [{ name: file.name.replace(/\.json$/i, ''), questions: data }] : (data.sets || (data.questions ? [data] : []));
      sets = sets.map(normSet).filter(s => s.questions.length);
      if (!sets.length) throw new Error('none');
      let added = 0, updated = 0;
      for (const s of sets) {
        const i = Bank.sets.findIndex(x => x.id === s.id);
        if (i >= 0) { Bank.sets[i] = s; updated++; } else { Bank.sets.push(s); added++; }
      }
      Bank.save(); this.sel = sets[0].id; this.renderBank();
      toast(`Imported ${added} new set${added === 1 ? '' : 's'}${updated ? `, updated ${updated}` : ''}`);
    } catch { toast('That file isn\'t a Rounds Live export. Choose a .json file exported from this page.'); }
  },

  bankAct(act, el) {
    const set = Bank.get(this.sel);
    const qid = el.dataset.id;
    const qi = set ? set.questions.findIndex(q => q.id === qid) : -1;
    switch (act) {
      case 'pick': this.sel = qid; this.edit = null; this.bulk = false; this.confirm = null; break;
      case 'newset': { const s = normSet({ name: 'New question set', questions: [] }); Bank.sets.push(s); Bank.save(); this.sel = s.id; this.edit = 'new'; break; }
      case 'addq': this.edit = 'new'; this.editErr = ''; this.bulk = false; break;
      case 'editq': this.edit = qid; this.editErr = ''; this.bulk = false; break;
      case 'canceledit': this.edit = null; this.editErr = ''; break;
      case 'dupq': { const c = { ...clone(set.questions[qi]), id: uid(8) }; set.questions.splice(qi + 1, 0, c); Bank.save(); toast('Question copied'); break; }
      case 'upq': if (qi > 0) { [set.questions[qi - 1], set.questions[qi]] = [set.questions[qi], set.questions[qi - 1]]; Bank.save(); } break;
      case 'downq': if (qi < set.questions.length - 1) { [set.questions[qi + 1], set.questions[qi]] = [set.questions[qi], set.questions[qi + 1]]; Bank.save(); } break;
      case 'askdelq': this.confirm = qid; break;
      case 'delq': set.questions.splice(qi, 1); Bank.save(); this.confirm = null; toast('Question deleted'); break;
      case 'askdelset': this.confirm = 'set'; break;
      case 'delset': {
        Bank.sets = Bank.sets.filter(s => s.id !== set.id);
        if (!Bank.dismissed.includes(set.id)) Bank.dismissed.push(set.id);
        Bank.save(); this.sel = (Bank.sets[0] || {}).id || null; this.confirm = null; toast('Set deleted'); break;
      }
      case 'cancelconfirm': this.confirm = null; break;
      case 'bulk': this.bulk = true; this.bulkMsg = null; this.edit = null; break;
      case 'bulkcancel': this.bulk = false; this.bulkText = ''; this.bulkMsg = null; break;
      case 'bulkadd': {
        this.bulkText = $('#bulk-text').value;
        const res = parseBulk(this.bulkText);
        this.bulkMsg = res;
        if (res.questions.length) { set.questions.push(...res.questions); Bank.save(); toast(`Added ${res.questions.length} question${res.questions.length === 1 ? '' : 's'}`); }
        if (!this.bulkText.trim()) this.bulkMsg.errors = ['Paste at least one question.'];
        else if (!res.errors.length) { this.bulk = false; this.bulkText = ''; this.bulkMsg = null; }
        else if (res.questions.length) { this.bulkText = res.failed.join('\n\n'); this.bulkMsg.errors.unshift(`Added ${res.questions.length}. The ones left below need fixing:`); }
        break;
      }
      case 'exportset': this.download(`${set.name.replace(/[^\w-]+/g, '-').toLowerCase()}.json`, JSON.stringify({ app: 'rounds-live', v: 1, sets: [set] }, null, 2)); return;
      case 'export': this.download(`rounds-live-bank-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: 'rounds-live', v: 1, sets: Bank.sets }, null, 2)); return;
      case 'optshuffle': this.shuffle = el.checked; return;
      case 'optspeed': this.speed = el.checked; return;
      case 'openlobby': this.newGame(set); return;
      case 'resume': this.resume(); return;
      case 'discard': LS.del(GAME_KEY); this.resumable = null; break;
      default: return;
    }
    this.renderBank();
  },

  /* ---------- game lifecycle ---------- */
  newGame(set) {
    const qs = clone(set.questions);
    if (this.shuffle) shuffle(qs);
    this.game = { code: randCode(), title: set.name, setId: set.id, questions: qs, qIndex: -1, phase: 'lobby', players: {}, kicked: [],
      qStartedAt: 0, qDuration: 0, settings: { speed: this.speed }, scored: {}, prev: {}, createdAt: Date.now() };
    this.resumable = null;
    this.save(); this.startNet(false); this.renderGame(); keepAwake();
  },
  resume() {
    const g = this.resumable; if (!g) return;
    this.game = g; this.resumable = null;
    for (const p of Object.values(g.players)) p.connected = !!p.bot;
    this.startNet(true); this.renderGame(); keepAwake();
    if (g.phase === 'question') {
      if (Date.now() >= g.qStartedAt + g.qDuration) this.reveal(); else { this.startTick(); this.scheduleBots(); }
    }
  },
  save() { if (this.game) { this.game.updatedAt = Date.now(); LS.set(GAME_KEY, this.game); } },
  exitGame() {
    this.stopTimers(); if (this.net) this.net.destroy(); this.net = null;
    this.c2p.clear(); this.p2c.clear();
    if (this.game && this.game.phase === 'final') LS.del(GAME_KEY);
    this.game = null; this.endConfirm = false; this.kickConfirm = null;
    const saved = LS.get(GAME_KEY, null); this.resumable = saved && saved.phase !== 'final' ? saved : null;
    this.renderBank();
  },
  stopTimers() {
    clearInterval(this.tickT); clearInterval(this.hbT); clearTimeout(this.lobbyT);
    this.botT.forEach(clearTimeout); this.botT = []; this.finalT.forEach(clearTimeout); this.finalT = [];
    this.tickT = this.hbT = null;
  },

  startNet(resuming) {
    const g = this.game;
    if (this.net) this.net.destroy();
    this.netState = 'connecting'; this.netErr = '';
    let tries = 0;
    const handlers = {
      onReady: () => { this.netState = 'online'; this.netErr = ''; this.updateNet(); },
      onMessage: (cid, m) => this.onMsg(cid, m),
      onDisconnect: cid => {
        const pid = this.c2p.get(cid); this.c2p.delete(cid);
        if (pid && this.p2c.get(pid) === cid) { this.p2c.delete(pid); const p = g.players[pid]; if (p) { p.connected = false; this.live(); } }
      },
      onIdTaken: () => {
        if (!resuming && g.phase === 'lobby' && !Object.keys(g.players).length) {
          this.net.destroy(); g.code = randCode(); this.save(); this.net = hostTransport(g.code, handlers); this.net.start(); this.renderGame();
        } else {
          // our previous connection (e.g. before a reload) still holds the code; wait for the service to release it
          this.netState = 'wait'; this.updateNet();
          if (++tries < 12) setTimeout(() => { if (this.game !== g) return; this.net.destroy(); this.net = hostTransport(g.code, handlers); this.net.start(); }, 5000);
          else { this.netState = 'offline'; this.netErr = 'The game code is still held by an earlier session. Start a new game from the bank.'; this.updateNet(); }
        }
      },
      onNetIssue: err => {
        this.netState = 'offline';
        this.netErr = err && err.type === 'lib-missing' ? 'The connection library did not load. Check the internet connection and reload.' : 'Can\'t reach the connection service. Retrying…';
        this.updateNet();
      }
    };
    this.net = hostTransport(g.code, handlers);
    this.net.start();
    clearInterval(this.hbT);
    this.hbT = setInterval(() => {
      const now = Date.now(); let changed = false;
      for (const [pid, cid] of this.p2c) {
        this.net.send(cid, { t: 'ping' });
        const p = g.players[pid];
        if (p && p.connected && now - (p.lastSeen || 0) > 16000) { p.connected = false; changed = true; }
      }
      if (changed) this.live();
    }, 4000);
  },
  netHtml() {
    const s = this.netState;
    const label = s === 'online' ? (NET_LOCAL ? 'Local test mode' : 'Online') : s === 'wait' ? 'Reclaiming game code…' : s === 'offline' ? 'Offline' : 'Connecting…';
    return `<span class="net ${s === 'online' ? '' : s === 'offline' ? 'bad' : 'wait'}" title="${esc(this.netErr || '')}"><i></i>${label}</span>`;
  },
  updateNet() {
    const el = $('#netstat'); if (el) el.innerHTML = this.netHtml();
    const er = $('#neterr'); if (er) { er.textContent = this.netErr || ''; er.hidden = !this.netErr; }
  },

  send(pid, m) { const cid = this.p2c.get(pid); if (cid && this.net) this.net.send(cid, m); },
  onMsg(cid, m) {
    const g = this.game; if (!g || !m || typeof m !== 'object') return;
    const pid0 = this.c2p.get(cid);
    if (pid0 && g.players[pid0]) { const p = g.players[pid0]; p.lastSeen = Date.now(); if (!p.connected) { p.connected = true; this.live(); } }
    if (m.t === 'join') this.join(cid, m);
    else if (m.t === 'answer' && pid0) this.answer(pid0, m.q, m.choice);
  },
  join(cid, m) {
    const g = this.game;
    const pid = String(m.pid || '');
    if (!/^[a-z0-9]{6,40}$/.test(pid)) return;
    const reply = msg => this.net.send(cid, msg);
    if (g.kicked.includes(pid)) { reply({ t: 'kicked' }); return; }
    let p = g.players[pid];
    if (!p) {
      const name = cleanName(m.name);
      if (g.phase === 'final') { reply({ t: 'reject', reason: 'ended' }); return; }
      if (!name) { reply({ t: 'reject', reason: 'name' }); return; }
      if (Object.values(g.players).some(o => o.name.toLowerCase() === name.toLowerCase())) { reply({ t: 'reject', reason: 'name-taken' }); return; }
      p = g.players[pid] = { pid, name, avatar: AVATARS.includes(m.avatar) ? m.avatar : AVATARS[Object.keys(g.players).length % AVATARS.length],
        score: 0, timeSum: 0, answers: {}, joinedAt: Date.now(), isNew: true };
      if (g.phase === 'lobby') SFX.pop();
    }
    const old = this.p2c.get(pid);
    if (old && old !== cid) { this.c2p.delete(old); this.net.drop(old); }
    this.p2c.set(pid, cid); this.c2p.set(cid, pid);
    p.connected = true; p.lastSeen = Date.now();
    reply({ t: 'joined', pid, name: p.name, avatar: p.avatar });
    this.sendView(pid);
    this.save(); this.live();
    if (g.phase === 'lobby') { clearTimeout(this.lobbyT); this.lobbyT = setTimeout(() => this.broadcast(), 400); }
  },
  answer(pid, qi, choice) {
    const g = this.game, p = g.players[pid];
    if (!p) return;
    if (g.phase !== 'question' || qi !== g.qIndex) { this.sendView(pid); return; }
    const q = g.questions[g.qIndex];
    choice = Number(choice);
    if (!Number.isInteger(choice) || choice < 0 || choice >= q.options.length) return;
    if (p.answers[qi]) { this.sendView(pid); return; }
    const ms = Date.now() - g.qStartedAt;
    if (ms > g.qDuration + 1000) { this.sendView(pid); return; }
    p.answers[qi] = { choice, ms: Math.max(0, Math.min(ms, g.qDuration)) };
    this.save(); this.sendView(pid); this.live(); SFX.pop();
    if (this.allAnswered()) { const qi0 = qi; setTimeout(() => { if (g.phase === 'question' && g.qIndex === qi0) this.reveal(); }, 900); }
  },
  activePlayers() { return Object.values(this.game.players).filter(p => p.bot || p.connected); },
  allAnswered() { const a = this.activePlayers(); return a.length > 0 && a.every(p => p.answers[this.game.qIndex]); },

  ranked() {
    const arr = Object.values(this.game.players);
    arr.sort((a, b) => b.score - a.score || a.timeSum - b.timeSum || a.name.localeCompare(b.name));
    let rank = 0, prevS = null, prevT = null;
    return arr.map((p, i) => { if (p.score !== prevS || p.timeSum !== prevT) { rank = i + 1; prevS = p.score; prevT = p.timeSum; } return { p, rank }; });
  },
  viewFor(pid, ranks) {
    const g = this.game, p = g.players[pid]; if (!p) return null;
    const v = { phase: g.phase, title: g.title, score: p.score, total: g.questions.length, qIndex: g.qIndex, players: Object.keys(g.players).length };
    if (g.phase === 'question') {
      const q = g.questions[g.qIndex], a = p.answers[g.qIndex];
      Object.assign(v, { text: q.text, options: q.options, remainingMs: Math.max(0, g.qStartedAt + g.qDuration - Date.now()), durationMs: g.qDuration, answered: a ? a.choice : null });
    } else if (g.phase === 'reveal' || g.phase === 'leaderboard' || g.phase === 'final') {
      ranks = ranks || this.ranked();
      const me = ranks.find(r => r.p.pid === pid);
      v.rank = me ? me.rank : null;
      if (g.qIndex >= 0 && g.phase !== 'final') {
        const q = g.questions[g.qIndex], a = p.answers[g.qIndex];
        Object.assign(v, { options: q.options, correct: q.correct, choice: a ? a.choice : null, gained: a ? a.points || 0 : 0 });
      }
      if (g.phase === 'final') {
        v.correctCount = Object.values(p.answers).filter(a => a.correct).length;
        v.top = ranks.slice(0, 3).map(r => ({ name: r.p.name, avatar: r.p.avatar, score: r.p.score }));
      }
    }
    return v;
  },
  sendView(pid, ranks) { const v = this.viewFor(pid, ranks); if (v) this.send(pid, { t: 'view', v }); },
  broadcast() {
    const g = this.game; if (!g) return;
    const ranks = (g.phase === 'lobby' || g.phase === 'question') ? null : this.ranked();
    for (const pid of this.p2c.keys()) this.sendView(pid, ranks);
  },

  /* ---------- phases ---------- */
  startGame() {
    const g = this.game; if (!Object.keys(g.players).length) return;
    g.qIndex = 0; this.startQuestion();
  },
  startQuestion() {
    const g = this.game, q = g.questions[g.qIndex];
    g.phase = 'question'; g.qStartedAt = Date.now(); g.qDuration = q.time * 1000; this.endConfirm = false;
    this.save(); this.renderGame(); this.broadcast(); this.scheduleBots(); this.startTick(); SFX.start();
  },
  startTick() {
    clearInterval(this.tickT); this.lastTickSec = null;
    this.tickT = setInterval(() => {
      const g = this.game; if (!g || g.phase !== 'question') { clearInterval(this.tickT); return; }
      const rem = g.qStartedAt + g.qDuration - Date.now();
      const sec = Math.max(0, Math.ceil(rem / 1000));
      const ring = $('#ring');
      if (ring) {
        $('#ring-num').textContent = sec;
        const frac = Math.max(0, rem / g.qDuration);
        $('#ring-bar').style.strokeDashoffset = String(264 * (1 - frac));
        ring.classList.toggle('low', sec <= 5);
      }
      if (sec !== this.lastTickSec && sec <= 5 && sec > 0) SFX.tick();
      this.lastTickSec = sec;
      if (rem <= 0) this.reveal();
    }, 100);
  },
  scheduleBots() {
    const g = this.game, q = g.questions[g.qIndex];
    this.botT.forEach(clearTimeout); this.botT = [];
    for (const p of Object.values(g.players)) {
      if (!p.bot || p.answers[g.qIndex]) continue;
      const delay = 1200 + Math.random() * g.qDuration * .75;
      const right = Math.random() < p.skill;
      const choice = right ? q.correct : (q.correct + 1 + Math.floor(Math.random() * (q.options.length - 1))) % q.options.length;
      const qi = g.qIndex;
      this.botT.push(setTimeout(() => this.answer(p.pid, qi, choice), delay));
    }
  },
  addBots(n = 3) {
    const g = this.game, taken = new Set(Object.values(g.players).map(p => p.name));
    const names = BOT_NAMES.filter(b => !taken.has(b + ' (bot)'));
    for (let i = 0; i < n && i < names.length; i++) {
      const pid = 'bot' + uid(8);
      g.players[pid] = { pid, name: names[i] + ' (bot)', avatar: AVATARS[(Object.keys(g.players).length * 5 + 3) % AVATARS.length], score: 0, timeSum: 0, answers: {},
        joinedAt: Date.now(), bot: true, connected: true, skill: .45 + Math.random() * .4, isNew: true };
    }
    this.save(); this.live();
    if (g.phase === 'question') this.scheduleBots();
  },
  reveal() {
    const g = this.game; if (!g || g.phase !== 'question') return;
    clearInterval(this.tickT); this.botT.forEach(clearTimeout); this.botT = [];
    const q = g.questions[g.qIndex];
    const before = this.ranked();
    g.prev = { ranks: Object.fromEntries(before.map(r => [r.p.pid, r.rank])), scores: Object.fromEntries(before.map(r => [r.p.pid, r.p.score])) };
    if (!g.scored[g.qIndex]) {
      for (const p of Object.values(g.players)) {
        const a = p.answers[g.qIndex]; if (!a) continue;
        a.correct = a.choice === q.correct;
        a.points = a.correct ? (g.settings.speed ? Math.round(1000 * (1 - .5 * a.ms / g.qDuration)) : 1000) : 0;
        p.score += a.points; if (a.correct) p.timeSum += a.ms;
      }
      g.scored[g.qIndex] = true;
    }
    g.phase = 'reveal'; this.endConfirm = false;
    this.save(); this.renderGame(); this.broadcast(); SFX.reveal();
  },
  showBoard() { const g = this.game; g.phase = 'leaderboard'; this.save(); this.renderGame(); this.broadcast(); },
  next() { const g = this.game; if (g.qIndex < g.questions.length - 1) { g.qIndex++; this.startQuestion(); } else this.finish(); },
  finish() {
    const g = this.game;
    if (g.phase === 'question') this.reveal();
    this.stopTimers();
    g.phase = 'final'; g.finishedAt = Date.now(); this.endConfirm = false;
    this.save(); this.renderGame(); this.broadcast();
    // keep heartbeat so late reconnecting phones still get their final view
    this.hbT = setInterval(() => { for (const cid of this.p2c.values()) this.net && this.net.send(cid, { t: 'ping' }); }, 4000);
  },
  primary() {
    const g = this.game; if (!g) return;
    ({ lobby: () => this.startGame(), question: () => this.reveal(), reveal: () => this.showBoard(), leaderboard: () => this.next() }[g.phase] || (() => {}))();
  },
  onKey(e) {
    if (!this.game || e.target.closest('input,textarea,select')) return;
    if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter') {
      if (e.target.closest('button') && e.key !== 'ArrowRight') return;
      e.preventDefault(); this.primary();
    }
  },
  csv() {
    const g = this.game, ranks = this.ranked();
    const head = ['Rank', 'Name', 'Score', 'Correct', ...g.questions.map((q, i) => `Q${i + 1}`)];
    const rows = ranks.map(({ p, rank }) => [rank, p.name, p.score, Object.values(p.answers).filter(a => a.correct).length,
      ...g.questions.map((q, i) => { const a = p.answers[i]; return a ? `${LETTERS[a.choice]}${a.correct ? ' ✓' : ''} (${a.points || 0})` : '—'; })]);
    const cell = v => `"${String(v).replace(/"/g, '""')}"`;
    this.download(`rounds-live-${g.title.replace(/[^\w-]+/g, '-').toLowerCase()}-${new Date().toISOString().slice(0, 10)}.csv`,
      '﻿' + [head, ...rows].map(r => r.map(cell).join(',')).join('\n'), 'text/csv');
  },

  /* ---------- stage rendering ---------- */
  renderGame() {
    const g = this.game; if (!g) return;
    this.finalT.forEach(clearTimeout); this.finalT = [];
    const bar = `
      <header class="stage-bar wrap">
        <div class="brand"><span class="dot"></span>Rounds Live</div>
        ${g.phase !== 'lobby' && g.phase !== 'final' ? `<div class="joinpill">Join with code <span class="mono">${esc(g.code)}</span></div>` : ''}
        <span class="spacer"></span>
        <span id="netstat">${this.netHtml()}</span>
        <span class="hint num" id="pc">${Object.keys(g.players).length} players</span>
        <button class="btn small ghost" data-act="sound" aria-pressed="${SFX.on}">${SFX.on ? 'Sound on' : 'Sound off'}</button>
        <button class="btn small ghost" data-act="full">Full screen</button>
        ${g.phase === 'final' ? `<button class="btn small" data-act="exit">Back to question bank</button>`
          : this.endConfirm ? `<button class="btn small danger" data-act="end">End game now</button><button class="btn small ghost" data-act="noend">Keep playing</button>`
          : `<button class="btn small ghost" data-act="askend">End game</button>`}
      </header>
      <p class="err wrap" id="neterr" ${this.netErr ? '' : 'hidden'} style="padding-block:6px">${esc(this.netErr || '')}</p>`;
    const body = { lobby: () => this.lobbyHtml(), question: () => this.questionHtml(), reveal: () => this.revealHtml(), leaderboard: () => this.boardHtml(), final: () => this.finalHtml() }[g.phase]();
    const foot = this.footHtml();
    app.innerHTML = `<div class="stage">${bar}<section class="stage-body wrap">${body}</section>${foot}</div>`;
    for (const p of Object.values(g.players)) delete p.isNew;
    if (g.phase === 'question') this.startTickPaint();
    if (g.phase === 'leaderboard') this.animateBoard();
    if (g.phase === 'final') this.animateFinal();
    if (g.phase === 'reveal') requestAnimationFrame(() => document.querySelectorAll('.tile .bar').forEach(b => { b.style.width = b.dataset.w; }));
  },
  startTickPaint() { const r = $('#ring-bar'); if (r) r.style.strokeDashoffset = '0'; },
  footHtml() {
    const g = this.game;
    const n = Object.keys(g.players).length;
    const label = { lobby: 'Start game', question: 'Reveal answer', reveal: 'Show scoreboard', leaderboard: g.qIndex < g.questions.length - 1 ? 'Next question' : 'Final results' }[g.phase];
    let left = '';
    if (g.phase === 'lobby') left = `<button class="btn" data-act="bots">Add 3 practice bots</button><span class="hint">Bots answer on their own so you can rehearse.</span>`;
    else if (g.phase === 'question') left = `<span class="hint">Reveals automatically when time runs out or everyone has answered.</span>`;
    else if (g.phase === 'final') left = `<button class="btn" data-act="replay">Replay winner animation</button><button class="btn" data-act="csv">Download results (CSV)</button>`;
    else left = `<span class="hint">Question ${g.qIndex + 1} of ${g.questions.length}</span>`;
    return `<footer class="stage-foot wrap">${left}<span class="spacer"></span>
      ${label ? `<span class="hint"><span class="kbd">Space</span> or</span><button class="btn primary big" data-act="primary" id="primary" ${g.phase === 'lobby' && !n ? 'disabled' : ''}>${label}</button>` : ''}</footer>`;
  },
  joinUrl() {
    const u = new URL(location.href); u.search = ''; u.hash = '';
    u.searchParams.set('join', this.game.code); if (NET_LOCAL) u.searchParams.set('net', 'local'); if (QS.get('broker')) u.searchParams.set('broker', QS.get('broker'));
    return u.toString();
  },
  qrSvg(text) {
    try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true, alt: 'QR code to join' }); } catch { return ''; }
  },
  chip(p, extra = '') {
    return `<span class="chip ${p.connected || p.bot ? '' : 'off'} ${p.isNew ? 'new' : ''} ${extra}"><span class="ava">${p.avatar}</span><span class="nm">${esc(p.name)}</span></span>`;
  },
  lobbyHtml() {
    const g = this.game, url = this.joinUrl();
    const shortUrl = (location.host + location.pathname).replace(/index\.html$/, '').replace(/\/$/, '');
    const fileMode = location.protocol === 'file:' && !NET_LOCAL;
    return `
      <div class="lobby">
        <div class="joinbox">
          <p class="eyebrow">Scan to join</p>
          ${fileMode ? `<p class="note">The QR code appears once this page is opened from a website. Phones can't open a file stored on this computer.</p>` : `<div class="qr">${this.qrSvg(url)}</div>`}
          <div class="joinurl">or open <b>${esc(fileMode ? 'your hosted link' : shortUrl)}</b> and enter</div>
          <div class="code-big" aria-label="Game code ${esc(g.code.split('').join(' '))}">${esc(g.code)}</div>
          ${NET_LOCAL ? `<a class="btn small" href="${esc(url)}" target="_blank" rel="noopener">Open a test player tab</a>` : ''}
        </div>
        <div class="lobby-side">
          <div><p class="eyebrow">Up next</p><h1>${esc(g.title)}</h1><p class="note">${g.questions.length} questions${g.settings.speed ? ' · faster answers score more' : ''}</p></div>
          <div class="pcount"><span class="num" id="lobby-n">${Object.keys(g.players).length}</span> joined</div>
          <div id="lobby-players">${this.lobbyPlayers()}</div>
        </div>
      </div>`;
  },
  lobbyPlayers() {
    const g = this.game, ps = Object.values(g.players).sort((a, b) => a.joinedAt - b.joinedAt);
    if (!ps.length) return `<div class="waiting">Waiting for players. Names appear here as people join.</div>`;
    return `<ul class="chips">${ps.map(p => `<li>${this.kickConfirm === p.pid
      ? `<button class="chip kick" data-act="kick" data-id="${p.pid}"><span class="ava">${p.avatar}</span><span class="nm">Remove ${esc(p.name)}?</span></button>`
      : `<button class="chip ${p.connected || p.bot ? '' : 'off'} ${p.isNew ? 'new' : ''}" data-act="askkick" data-id="${p.pid}" title="Click to remove"><span class="ava">${p.avatar}</span><span class="nm">${esc(p.name)}</span></button>`}</li>`).join('')}</ul>
      <p class="note" style="margin-top:10px">Click a name to remove that player.</p>`;
  },
  questionHtml() {
    const g = this.game, q = g.questions[g.qIndex];
    const active = this.activePlayers(), done = active.filter(p => p.answers[g.qIndex]).length;
    return `
      <div class="qstage">
        <div class="qhead">
          <p class="eyebrow">Question ${g.qIndex + 1} of ${g.questions.length}</p>
          <div class="ring" id="ring"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"/><circle class="bar" id="ring-bar" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="0"/></svg><b id="ring-num" class="num">${q.time}</b></div>
          <div class="anscount"><b class="num" id="ans-n">${done}/${active.length}</b><span>answered</span></div>
        </div>
        <h1 class="qbig">${esc(q.text)}</h1>
        ${q.image ? `<img class="qimg" src="${esc(q.image)}" alt="" onerror="this.hidden=true">` : ''}
        <div class="tiles">${q.options.map((o, i) => `<div class="tile c${i}">${SHAPES[i]}<span class="txt">${esc(o)}</span></div>`).join('')}</div>
        <div class="who" id="who">${this.whoHtml()}</div>
      </div>`;
  },
  whoHtml() {
    const g = this.game;
    return Object.values(g.players).filter(p => p.bot || p.connected).sort((a, b) => a.joinedAt - b.joinedAt)
      .map(p => this.chip(p, p.answers[g.qIndex] ? 'done' : 'todo')).join('');
  },
  revealHtml() {
    const g = this.game, q = g.questions[g.qIndex];
    const players = Object.values(g.players);
    const counts = q.options.map((_, i) => players.filter(p => p.answers[g.qIndex] && p.answers[g.qIndex].choice === i).length);
    const max = Math.max(1, ...counts);
    const right = players.filter(p => p.answers[g.qIndex] && p.answers[g.qIndex].correct).sort((a, b) => a.answers[g.qIndex].ms - b.answers[g.qIndex].ms);
    const answered = players.filter(p => p.answers[g.qIndex]).length;
    const shown = right.slice(0, 30);
    return `
      <div class="qstage">
        <div class="qhead"><p class="eyebrow">Question ${g.qIndex + 1} of ${g.questions.length} · answer</p></div>
        <h1 class="qbig sm">${esc(q.text)}</h1>
        <div class="tiles">${q.options.map((o, i) => `
          <div class="tile c${i} ${i === q.correct ? 'win' : 'dim'}">${i === q.correct ? '<span class="tick">✓</span>' : SHAPES[i]}<span class="txt">${esc(o)}</span><span class="cnt num">${counts[i]}</span>
            <span class="bar" data-w="${(counts[i] / max * 100).toFixed(1)}%" style="width:0"></span></div>`).join('')}</div>
        <div class="reveal-low ${q.explanation ? '' : 'one'}">
          <div class="panel">
            <h3>${right.length ? `Got it right · ${right.length} of ${answered || players.length}` : 'Nobody got this one'}</h3>
            ${right.length ? `<div class="rightlist">${shown.map((p, i) => `<span class="chip ${i === 0 ? 'first' : ''}"><span class="ava">${p.avatar}</span><span class="nm">${esc(p.name)}</span><em class="num">+${fmt(p.answers[g.qIndex].points)}</em>${i === 0 ? '<span class="hint">fastest</span>' : ''}</span>`).join('')}${right.length > shown.length ? `<span class="chip">+${right.length - shown.length} more</span>` : ''}</div>` : '<p class="note">The scoreboard stays the same this round.</p>'}
          </div>
          ${q.explanation ? `<div class="panel"><h3>Why</h3><p class="expl">${esc(q.explanation)}</p></div>` : ''}
        </div>
      </div>`;
  },
  boardHtml() {
    const g = this.game, ranks = this.ranked(), top = ranks.slice(0, 8);
    const last = g.qIndex >= g.questions.length - 1;
    return `
      <div class="board">
        <div><p class="eyebrow">After question ${g.qIndex + 1} of ${g.questions.length}</p><h1>${last ? 'Standings before the big reveal' : 'Scoreboard'}</h1></div>
        <div class="rows" id="rows" style="height:${top.length * 70}px">
          ${top.map(({ p, rank }) => {
            const a = p.answers[g.qIndex], pr = g.prev.ranks ? g.prev.ranks[p.pid] : rank;
            const mv = pr == null ? '' : pr > rank ? '<span class="mv up">▲</span>' : pr < rank ? '<span class="mv down">▼</span>' : '<span class="mv"></span>';
            return `<div class="lrow ${rank === 1 ? 'top' : ''}" data-pid="${p.pid}" data-from="${g.prev.scores ? (g.prev.scores[p.pid] ?? p.score) : p.score}" data-to="${p.score}" data-prevrank="${pr ?? rank}" data-rank="${rank}">
              <span class="rk num">${rank}</span><span class="ava">${p.avatar}</span><span class="nm">${esc(p.name)}</span>
              <span class="gain">${a && a.points ? '+' + fmt(a.points) : ''}</span><span class="sc">${fmt(p.score)}</span></div>`;
          }).join('')}
        </div>
        ${ranks.length > top.length ? `<p class="more">+ ${ranks.length - top.length} more players</p>` : ''}
      </div>`;
  },
  animateBoard() {
    const g = this.game, rows = [...document.querySelectorAll('.lrow')];
    const H = 70, rowH = 60;
    const order = rows.map(r => r.dataset.pid);
    // previous order among the shown rows
    const prevOrder = [...order].sort((a, b) => {
      const ra = rows.find(r => r.dataset.pid === a), rb = rows.find(r => r.dataset.pid === b);
      return (+ra.dataset.prevrank - +rb.dataset.prevrank) || (+rb.dataset.from - +ra.dataset.from);
    });
    rows.forEach(r => {
      r.style.height = rowH + 'px';
      const from = prevOrder.indexOf(r.dataset.pid), to = order.indexOf(r.dataset.pid);
      r.style.transition = 'none'; r.style.transform = `translateY(${(REDUCED ? to : from) * H}px)`;
      r.querySelector('.sc').textContent = fmt(REDUCED ? +r.dataset.to : +r.dataset.from);
    });
    if (REDUCED) { rows.forEach(r => r.querySelector('.gain').classList.add('show')); return; }
    rows.forEach(r => r.querySelector('.gain').classList.add('show'));
    this.finalT.push(setTimeout(() => {
      rows.forEach(r => { r.style.transition = ''; r.style.transform = `translateY(${order.indexOf(r.dataset.pid) * H}px)`; });
      const t0 = performance.now();
      const step = t => {
        const k = Math.min(1, (t - t0) / 1000), e = 1 - Math.pow(1 - k, 3);
        rows.forEach(r => { const a = +r.dataset.from, b = +r.dataset.to; r.querySelector('.sc').textContent = fmt(Math.round(a + (b - a) * e)); });
        if (k < 1 && this.game === g && g.phase === 'leaderboard') requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }, 700));
  },
  finalHtml() {
    const g = this.game, ranks = this.ranked();
    const pod = (i, cls) => {
      const r = ranks[i];
      return `<div class="pod ${cls} ${r ? '' : 'none'}" id="pod${i + 1}">
        <div class="pod-who">${r ? `<span class="ava">${r.p.avatar}</span><span class="nm">${esc(r.p.name)}</span><span class="sc num">${fmt(r.p.score)} pts</span>` : ''}</div>
        <div class="pod-block">${i + 1}</div></div>`;
    };
    return `
      <div class="final">
        <div><p class="eyebrow">${esc(g.title)} · final results</p><h1>Who takes it?</h1></div>
        <div class="drum" id="drum"></div>
        <div class="podium">${pod(1, 'p2')}${pod(0, 'p1')}${pod(2, 'p3')}</div>
        <div class="standings" id="standings">
          ${ranks.map(({ p, rank }) => `<div class="srow"><span class="rk">${rank}</span><span>${p.avatar}</span><span class="nm">${esc(p.name)}</span>
            <span class="sub num">${Object.values(p.answers).filter(a => a.correct).length}/${g.questions.length} correct</span><span class="sc num">${fmt(p.score)}</span></div>`).join('')}
        </div>
      </div>`;
  },
  animateFinal() {
    const g = this.game, n = Object.keys(g.players).length;
    const at = (ms, fn) => this.finalT.push(setTimeout(() => { if (this.game === g && g.phase === 'final') fn(); }, REDUCED ? 0 : ms));
    const up = i => { const el = $('#pod' + i); if (el) el.classList.add('up'); };
    const drum = t => { const d = $('#drum'); if (d) d.textContent = t; };
    let t = 500;
    if (n >= 3) { at(t, () => { drum('Third place'); up(3); SFX.pop(); }); t += 1800; }
    if (n >= 2) { at(t, () => { drum('Second place'); up(2); SFX.pop(); }); t += 1900; }
    at(t, () => { drum('And the winner is…'); SFX.drum(); }); t += 1900;
    at(t, () => { drum('Champion!'); up(1); confetti(); SFX.fanfare(); });
    at(t + 900, () => confetti(140));
    at(t + 2200, () => { const s = $('#standings'); if (s) s.classList.add('show'); });
  },
  live() {
    const g = this.game; if (!g) return;
    const pc = $('#pc'); if (pc) pc.textContent = `${Object.keys(g.players).length} players`;
    if (g.phase === 'lobby') {
      const lp = $('#lobby-players'); if (lp) lp.innerHTML = this.lobbyPlayers();
      const n = $('#lobby-n'); if (n) n.textContent = Object.keys(g.players).length;
      const pr = $('#primary'); if (pr) pr.disabled = !Object.keys(g.players).length;
      for (const p of Object.values(g.players)) delete p.isNew;
    } else if (g.phase === 'question') {
      const w = $('#who'); if (w) w.innerHTML = this.whoHtml();
      const a = this.activePlayers(), done = a.filter(p => p.answers[g.qIndex]).length;
      const an = $('#ans-n'); if (an) an.textContent = `${done}/${a.length}`;
      for (const p of Object.values(g.players)) delete p.isNew;
    }
  },
  gameAct(act, el) {
    const g = this.game;
    switch (act) {
      case 'primary': this.primary(); return;
      case 'bots': this.addBots(3); return;
      case 'askkick': this.kickConfirm = el.dataset.id; this.live(); return;
      case 'kick': {
        const pid = el.dataset.id; this.send(pid, { t: 'kicked' });
        const cid = this.p2c.get(pid); if (cid) { this.p2c.delete(pid); this.c2p.delete(cid); }
        delete g.players[pid]; g.kicked.push(pid); this.kickConfirm = null; this.save(); this.live();
        clearTimeout(this.lobbyT); this.lobbyT = setTimeout(() => this.broadcast(), 300); return;
      }
      case 'sound': SFX.on = !SFX.on; LS.set('roundslive.sound', SFX.on); if (SFX.on) SFX.pop(); el.textContent = SFX.on ? 'Sound on' : 'Sound off'; el.setAttribute('aria-pressed', SFX.on); return;
      case 'full': { const d = document.documentElement; if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else if (d.requestFullscreen) d.requestFullscreen().catch(() => {}); return; }
      case 'askend': this.endConfirm = true; this.renderGameBarOnly(); return;
      case 'noend': this.endConfirm = false; this.renderGameBarOnly(); return;
      case 'end': if (g.phase === 'lobby') { LS.del(GAME_KEY); this.exitGame(); } else this.finish(); return;
      case 'exit': this.exitGame(); return;
      case 'replay': this.renderGame(); return;
      case 'csv': this.csv(); return;
    }
  },
  renderGameBarOnly() {
    // re-render without restarting the question timer visuals
    const g = this.game;
    if (g.phase === 'question') { const keep = app.querySelector('.stage-body'); const html = keep.innerHTML; this.renderGame(); app.querySelector('.stage-body').innerHTML = html; }
    else if (g.phase === 'final' || g.phase === 'leaderboard') { const keep = app.querySelector('.stage-body'); const node = keep.cloneNode(true); this.renderGame(); this.finalT.forEach(clearTimeout); this.finalT = []; app.querySelector('.stage-body').replaceWith(node); }
    else this.renderGame();
  }
};

/* ============================================================
   PLAYER (phone)
   ============================================================ */
const Player = {
  code: '', pid: '', name: '', avatar: AVATARS[0], net: null, view: null, status: 'form', err: '',
  joined: false, everJoined: false, attempt: 0, retry: 0, deadline: 0, timerT: null, watchT: null, resendT: null, pending: null,

  init(code) {
    const prof = LS.get(PROFILE_KEY, {});
    this.name = prof.name || ''; this.avatar = AVATARS.includes(prof.avatar) ? prof.avatar : AVATARS[Math.floor(Math.random() * AVATARS.length)];
    this.code = normCode(code);
    const me = this.code ? LS.get(ME_KEY(this.code), null) : null;
    if (me && me.pid && Date.now() - (me.at || 0) < 8 * 3600e3) { this.pid = me.pid; this.name = me.name; this.avatar = me.avatar; this.everJoined = true; this.connect(); }
    else this.render();
    this.watchT = setInterval(() => {
      if (this.joined && Date.now() - this.lastMsg > 14000 && !(this.view && this.view.phase === 'final')) this.reconnect();
    }, 3000);
  },
  submit() {
    const code = normCode($('#j-code').value), name = cleanName($('#j-name').value);
    this.code = code; this.name = name;
    if (code.length !== 4) { this.err = 'Enter the 4-letter code shown on the main screen.'; this.render(); return; }
    if (!name) { this.err = 'Pick a nickname.'; this.render(); return; }
    LS.set(PROFILE_KEY, { name, avatar: this.avatar });
    const me = LS.get(ME_KEY(code), null);
    this.pid = me && me.name === name ? me.pid : uid(14);
    this.err = ''; this.everJoined = false; this.retry = 0;
    this.connect();
  },
  connect() {
    this.status = this.everJoined ? 'reconnecting' : 'connecting'; this.joined = false; this.render();
    if (this.net) this.net.destroy();
    const my = ++this.attempt;
    const ok = () => my === this.attempt;
    this.net = clientTransport(this.code, {
      onOpen: () => { if (!ok()) return; this.lastMsg = Date.now(); this.net.send({ t: 'join', pid: this.pid, name: this.name, avatar: this.avatar }); },
      onMessage: m => { if (!ok()) return; this.lastMsg = Date.now(); this.onMsg(m); },
      onClose: () => { if (ok()) this.reconnect(); },
      onError: e => {
        if (!ok()) return;
        if (e && e.type === 'peer-unavailable' && !this.everJoined) { this.net.destroy(); this.status = 'notfound'; this.render(); return; }
        if (e && e.type === 'lib-missing') { this.status = 'neterror'; this.render(); return; }
        this.reconnect();
      }
    });
    clearTimeout(this.connT);
    this.connT = setTimeout(() => { if (ok() && !this.joined && this.status !== 'notfound') this.reconnect(); }, 15000);
  },
  reconnect() {
    if (this.status === 'kicked' || this.status === 'notfound' || this.status === 'form') return;
    if (this.view && this.view.phase === 'final' && this.joined) { this.joined = false; this.renderConn(); return; }
    this.joined = false; this.retry++;
    this.status = this.everJoined ? 'reconnecting' : 'connecting'; this.render();
    const my = ++this.attempt;
    if (this.net) this.net.destroy();
    setTimeout(() => { if (my === this.attempt) this.connect(); }, Math.min(1000 * this.retry, 6000));
  },
  leave() {
    this.attempt++; if (this.net) this.net.destroy(); this.net = null;
    LS.del(ME_KEY(this.code)); this.joined = false; this.everJoined = false; this.view = null; this.status = 'form';
    { const u = new URL(location.href); u.searchParams.delete('join'); history.replaceState(null, '', location.pathname + u.search); }
    this.render();
  },
  onMsg(m) {
    if (!m || typeof m !== 'object') return;
    switch (m.t) {
      case 'ping': this.net.send({ t: 'pong' }); break;
      case 'joined':
        this.joined = true; this.everJoined = true; this.retry = 0; this.status = 'joined';
        this.name = m.name || this.name; this.avatar = m.avatar || this.avatar;
        LS.set(ME_KEY(this.code), { pid: this.pid, name: this.name, avatar: this.avatar, at: Date.now() });
        if (!/[?&]join=/.test(location.search)) { const u = new URL(location.href); u.searchParams.set('join', this.code); history.replaceState(null, '', u.search); }
        keepAwake(); this.render(); break;
      case 'reject':
        this.attempt++; this.net.destroy(); this.status = 'form';
        this.err = m.reason === 'name-taken' ? `Someone already joined as "${this.name}". Pick another nickname.` : m.reason === 'ended' ? 'That game has already finished.' : 'Pick a nickname.';
        this.render(); break;
      case 'kicked':
        this.attempt++; this.net.destroy(); LS.del(ME_KEY(this.code)); this.status = 'kicked'; this.joined = false; this.render(); break;
      case 'view': {
        const prev = this.view; const v = m.v; this.view = v;
        if (v.phase === 'question') {
          this.deadline = Date.now() + v.remainingMs - 250;
          if (v.answered != null) { this.pending = null; clearTimeout(this.resendT); }
          // same question, only the answered state changed: avoid re-rendering the whole screen
          if (prev && prev.phase === 'question' && prev.qIndex === v.qIndex && $('.p-opts')) { this.paintAnswered(); return; }
          this.pending = (prev && prev.qIndex === v.qIndex) ? this.pending : null;
        }
        if (v.phase === 'final' && (!prev || prev.phase !== 'final') && v.rank && v.rank <= 3) setTimeout(() => confetti(v.rank === 1 ? 200 : 90), 400);
        this.render(); break;
      }
    }
  },
  tapAnswer(i) {
    const v = this.view;
    if (!v || v.phase !== 'question' || v.answered != null || this.pending != null || Date.now() > this.deadline) return;
    this.pending = i;
    const send = () => this.net && this.net.send({ t: 'answer', q: v.qIndex, choice: i });
    send();
    if (navigator.vibrate) { try { navigator.vibrate(30); } catch {} }
    clearTimeout(this.resendT);
    const again = n => { this.resendT = setTimeout(() => { if (this.view === v && v.answered == null && this.pending === i && n > 0) { send(); again(n - 1); } }, 2000); };
    again(4);
    this.paintAnswered();
  },
  paintAnswered() {
    const v = this.view, chosen = v.answered != null ? v.answered : this.pending;
    document.querySelectorAll('.p-opt').forEach((b, i) => {
      b.disabled = chosen != null; b.classList.toggle('sel', chosen === i); b.classList.toggle('faded', chosen != null && chosen !== i);
    });
    const l = $('#locked'); if (l) l.textContent = chosen != null ? (v.answered != null ? 'Answer locked in. Eyes on the main screen.' : 'Sending…') : '';
  },
  renderConn() { const c = $('.conn'); if (c) c.classList.toggle('off', !this.joined); },

  header() {
    const v = this.view;
    return `<div class="p-top"><div class="p-me"><span class="p-ava">${this.avatar}</span><div style="min-width:0"><div class="p-name">${esc(this.name)}</div><div class="hint">Game ${esc(this.code)}</div></div></div>
      ${v && v.phase !== 'lobby' ? `<div class="p-score num">${fmt(v.score)}</div>` : ''}<span class="conn ${this.joined ? '' : 'off'}" title="${this.joined ? 'Connected' : 'Reconnecting'}"></span></div>`;
  },
  render() {
    clearInterval(this.timerT);
    const s = this.status;
    if (s === 'form') return this.renderForm();
    let body = '';
    if (s === 'connecting' || (s === 'reconnecting' && !this.view)) {
      body = `<div class="p-center"><div class="spinner"></div><div class="p-big">Joining ${esc(this.code)}…</div><p class="p-sub">${this.retry > 2 ? 'Still trying. Check that this phone is online and the main screen shows this code.' : 'Connecting to the main screen.'}</p>
        <button class="linkbtn" data-act="leave">Use a different code</button></div>`;
      return this.shell(body, false);
    }
    if (s === 'notfound') {
      body = `<div class="p-center"><div class="p-big">No game called ${esc(this.code)}</div><p class="p-sub">Check the code on the main screen. The host may not have opened the lobby yet.</p>
        <button class="btn primary big" data-act="retry">Try again</button><button class="linkbtn" data-act="leave">Enter a different code</button></div>`;
      return this.shell(body, false);
    }
    if (s === 'neterror') {
      body = `<div class="p-center"><div class="p-big">Can't load the game</div><p class="p-sub">This phone couldn't download a part of the page it needs. Check your connection and reload.</p></div>`;
      return this.shell(body, false);
    }
    if (s === 'kicked') {
      body = `<div class="p-center"><div class="p-big">You've been removed</div><p class="p-sub">The host removed you from this game.</p><button class="btn big" data-act="leave">Join again</button></div>`;
      return this.shell(body, false);
    }
    const v = this.view;
    if (!v || v.phase === 'lobby') {
      body = `<div class="p-center"><div style="font-size:4rem;line-height:1">${this.avatar}</div><div class="p-big">You're in, ${esc(this.name)}!</div>
        <p class="p-sub">${v ? `${v.players} player${v.players === 1 ? '' : 's'} in the lobby. ` : ''}Watch the main screen. Questions will appear here.</p>
        ${s === 'reconnecting' ? '<p class="p-sub">Reconnecting…</p>' : ''}<button class="linkbtn" data-act="leave">Leave game</button></div>`;
    } else if (v.phase === 'question') {
      const chosen = v.answered != null ? v.answered : this.pending;
      const short = v.options.every(o => o.length <= 22);
      body = `<div class="p-q">
          <div class="p-qhead"><span class="eyebrow">Question ${v.qIndex + 1} of ${v.total}</span><span class="mono" id="p-sec"></span></div>
          <div class="p-timer"><i id="p-bar" style="width:100%"></i></div>
          <div class="p-qtext">${esc(v.text)}</div>
          <div class="p-opts ${short && v.options.length > 2 ? 'grid2' : ''}">
            ${v.options.map((o, i) => `<button class="p-opt c${i} ${chosen === i ? 'sel' : chosen != null ? 'faded' : ''}" data-act="answer" data-i="${i}" ${chosen != null ? 'disabled' : ''}>${SHAPES[i]}<span>${esc(o)}</span></button>`).join('')}
          </div>
          <p class="locked" id="locked">${chosen != null ? (v.answered != null ? 'Answer locked in. Eyes on the main screen.' : 'Sending…') : ''}</p>
        </div>`;
      this.shell(body, true);
      const tick = () => {
        const rem = Math.max(0, this.deadline - Date.now());
        const bar = $('#p-bar'), sec = $('#p-sec');
        if (bar) bar.style.width = (rem / v.durationMs * 100).toFixed(1) + '%';
        if (sec) sec.textContent = Math.ceil(rem / 1000) + ' s';
        if (rem <= 0) {
          clearInterval(this.timerT);
          if (this.view === v && v.answered == null && this.pending == null) {
            document.querySelectorAll('.p-opt').forEach(b => { b.disabled = true; b.classList.add('faded'); });
            const l = $('#locked'); if (l) l.textContent = 'Time\'s up.';
          }
        }
      };
      tick(); this.timerT = setInterval(tick, 200);
      return;
    } else if (v.phase === 'reveal' || v.phase === 'leaderboard') {
      const ok = v.choice != null && v.choice === v.correct;
      body = `<div class="p-center">
        <div class="result ${ok ? 'ok' : 'no'}">
          <div class="p-big">${ok ? 'Correct!' : v.choice == null ? 'No answer' : 'Not this time'}</div>
          ${ok ? `<div class="pts num">+${fmt(v.gained)}</div>` : `<div class="answer-was"><span class="tag c${v.correct}" style="display:grid;place-items:center;width:34px;height:34px;border-radius:8px;flex:none">${SHAPES[v.correct]}</span><span>${esc(v.options[v.correct])}</span></div>`}
        </div>
        <p class="rankline">You're <b class="num">#${v.rank}</b> of ${v.players} · <span class="num">${fmt(v.score)}</span> pts</p>
        <p class="p-sub">Next question coming up.</p></div>`;
    } else if (v.phase === 'final') {
      const medal = ['🥇', '🥈', '🥉'][v.rank - 1] || '';
      body = `<div class="p-center">
        ${medal ? `<div style="font-size:4.5rem;line-height:1">${medal}</div>` : ''}
        <div class="p-big">${v.rank === 1 ? 'You won!' : `You finished #${v.rank}`}</div>
        <p class="rankline"><span class="num">${fmt(v.score)}</span> pts · ${v.correctCount}/${v.total} correct · ${v.players} players</p>
        ${v.top && v.top.length ? `<div class="card" style="text-align:left;gap:8px">${v.top.map((t, i) => `<div style="display:flex;gap:10px;align-items:center;font-weight:700"><span class="mono" style="color:var(--dim)">${i + 1}</span><span>${t.avatar}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.name)}</span><span class="num" style="color:var(--gold)">${fmt(t.score)}</span></div>`).join('')}</div>` : ''}
        <p class="p-sub">Thanks for playing.</p><button class="linkbtn" data-act="leave">Join another game</button></div>`;
    }
    this.shell(body, true);
  },
  shell(body, withHeader) {
    app.innerHTML = `<div class="phone wrap">${withHeader ? this.header() : `<div class="p-top"><div class="brand" style="font-size:1.3rem"><span class="dot"></span>Rounds Live</div></div>`}${body}</div>`;
  },
  renderForm() {
    app.innerHTML = `
      <div class="phone wrap">
        <div class="landing-hero"><div class="brand"><span class="dot"></span>Rounds Live</div><p>Answer live questions from your phone. The code is on the main screen.</p></div>
        <form class="card" id="joinform" autocomplete="off">
          <label class="f" for="j-code">Game code<input id="j-code" class="code-input" type="text" inputmode="text" autocapitalize="characters" maxlength="4" value="${esc(this.code)}" placeholder="ABCD" aria-describedby="j-err"></label>
          <label class="f" for="j-name">Nickname<input id="j-name" type="text" maxlength="16" value="${esc(this.name)}" placeholder="How the room will see you"></label>
          <div class="f" style="display:grid;gap:6px"><span style="font-weight:700;font-size:.9rem">Avatar</span>
            <div class="avatars" role="group" aria-label="Avatar">${AVATARS.map(a => `<button type="button" data-act="ava" data-a="${a}" aria-pressed="${a === this.avatar}">${a}</button>`).join('')}</div></div>
          <p class="err" id="j-err" ${this.err ? '' : 'hidden'}>${esc(this.err)}</p>
          <button class="btn primary big" type="submit">Join game</button>
        </form>
        <div class="landing-foot"><span class="note">Running the session?</span><a class="btn small ghost" href="?host${NET_LOCAL ? '&net=local' : ''}">Host a game on this screen</a></div>
      </div>`;
    const c = $('#j-code');
    c.addEventListener('input', () => { const p = c.selectionStart; c.value = normCode(c.value); c.setSelectionRange(p, p); });
    (this.code.length === 4 ? $('#j-name') : c).focus({ preventScroll: true });
  }
};

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (Host.active) {
    if (Host.game) Host.gameAct(act, el); else Host.bankAct(act, el);
    return;
  }
  switch (act) {
    case 'ava': Player.avatar = el.dataset.a; document.querySelectorAll('.avatars button').forEach(b => b.setAttribute('aria-pressed', b === el)); break;
    case 'answer': Player.tapAnswer(+el.dataset.i); break;
    case 'leave': Player.leave(); break;
    case 'retry': Player.retry = 0; Player.connect(); break;
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'joinform') Player.submit();
  if (e.target.id === 'qform') Host.saveEditor();
});
document.addEventListener('change', e => {
  if (Host.active && !Host.game && e.target.dataset.act) Host.bankAct(e.target.dataset.act, e.target);
}, true);

/* ---------------- boot ---------------- */
if (QS.has('host') || location.hash === '#host') Host.init();
else Player.init(QS.get('join') || '');
</script>
